<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The round in three depths: far, rooftops, the gatehouse bell, and one lit window, with the sky thinning by one shade over the life of the page; middle, the cart crossing the lane slowly from left to right at walking pace, lantern steady on its front rail, halting at the yard gate and beginning again as a new round; near, cobbles and the lantern's light pool sliding past in the opposite direction, and a cat crossing once, close, unhurried, and not crossing again">
